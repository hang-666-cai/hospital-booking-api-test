# ===== data/auth_data.yaml =====

# 注册测试数据
register:
  # 正常注册
  success:
    username: "auto_test_user_001"
    password: "test123456"
    phone: "13600136001"
    real_name: "自动化测试用户"

  # 用户名为空
  empty_username:
    username: ""
    password: "test123456"
    phone: "13600136002"
    expected_code: 400
    expected_msg: "用户名不能为空"

  # 密码太短
  short_password:
    username: "short_pwd_user"
    password: "123"
    phone: "13600136003"
    expected_code: 400
    expected_msg: "6-20"

  # 手机号格式错误
  invalid_phone:
    username: "bad_phone_user"
    password: "test123456"
    phone: "1234"
    expected_code: 400
    expected_msg: "手机号格式"

  # 用户名已存在
  duplicate_username:
    username: "zhangsan"
    password: "test123456"
    phone: "13600136099"
    expected_code: 400
    expected_msg: "已存在"

# 登录测试数据
login:
  # 正常登录
  success:
    username: "zhangsan"
    password: "123456"
    expected_code: 200

  # 密码错误
  wrong_password:
    username: "zhangsan"
    password: "wrong_password_xxx"
    expected_code: 401
    expected_msg: "密码错误"

  # 用户不存在
  user_not_found:
    username: "not_exist_user_xyz_abc"
    password: "123456"
    expected_code: 401
    expected_msg: "不存在"

  # 用户名为空
  empty_username:
    username: ""
    password: "123456"
    expected_code: 400
    expected_msg: "不能为空"

  # 密码为空
  empty_password:
    username: "zhangsan"
    password: ""
    expected_code: 400
    expected_msg: "不能为空"

# 参数化登录测试
login_parametrize:
  - username: "zhangsan"
    password: "123456"
    expected_code: 200
    case_title: "正确账号密码"

  - username: "zhangsan"
    password: "wrong123"
    expected_code: 401
    case_title: "密码错误"

  - username: "nobody_xyz"
    password: "123456"
    expected_code: 401
    case_title: "用户不存在"

  - username: ""
    password: "123456"
    expected_code: 400
    case_title: "用户名为空"

  - username: "zhangsan"
    password: ""
    expected_code: 400
    case_title: "密码为空"