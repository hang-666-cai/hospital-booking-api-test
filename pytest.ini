# ===== pytest.ini =====

[pytest]
# 测试文件路径
testpaths = testcases

# 文件/类/函数命名规范
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认参数
addopts = -v -s --alluredir=reports/allure-results --clean-alluredir

# 标记
markers =
    smoke: 冒烟测试
    auth: 认证模块
    hospital: 医院模块
    department: 科室模块
    doctor: 医生模块
    schedule: 排班模块
    appointment: 预约模块
    admin: 管理端
    permission: 权限测试